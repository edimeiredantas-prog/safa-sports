  <script>
    window.LucideReactShim = new Proxy({}, {
      get: function(_, iconName) {
        return function LucideIconWrapper(props) {
          const kebabName = String(iconName)
            .replace(/([a-z0-9])([A-Z])/g, '$1-$2')
            .toLowerCase();
          const iconData = window.lucide && window.lucide.icons ? window.lucide.icons[kebabName] : null;
          if (!iconData) {
            return React.createElement('span', { className: props?.className || 'inline-block w-4 h-4' });
          }
          const [tag, defaultAttrs, children] = iconData;
          return React.createElement(
            tag,
            {
              ...defaultAttrs,
              ...props,
              className: props?.className || 'w-4 h-4',
            },
            (children || []).map((child, idx) =>
              React.createElement(child[0], { ...child[1], key: idx })
            )
          );
        };
      }
    });
  </script>

    function calculateDonationMetrics(entry, isOverallEligibleWinner = false) {
      const e = entry || {};
      const totalBaskets =
        (Number(e.cestaBasica) || 0) +
        (Number(e.cestaIntermediaria) || 0) +
        (Number(e.cestaCompleta) || 0);

      const foodPoints =
        (Number(e.cestaBasica) || 0) * 10 +
        (Number(e.cestaIntermediaria) || 0) * 15 +
        (Number(e.cestaCompleta) || 0) * 20;

      const rawClothingPoints =
        (Number(e.cobertor) || 0) * 5 +
        (Number(e.moletom) || 0) * 4 +
        (Number(e.mangaLonga) || 0) * 3 +
        (Number(e.mangaCurta) || 0) * 2 +
        (Number(e.calcados) || 0) * 2;

      const validClothingPoints = Math.min(rawClothingPoints, 100);
      const totalCampaignPoints = foodPoints + validClothingPoints;

      let gamesPoints = 0;
      if (totalCampaignPoints === 0 || (totalBaskets <= 1 && rawClothingPoints === 0)) {
        gamesPoints = 0;
      } else if (totalCampaignPoints <= 199) {
        gamesPoints = 1;
      } else if (totalCampaignPoints <= 299) {
        gamesPoints = 2;
      } else if (totalCampaignPoints <= 399) {
        gamesPoints = 3;
      } else if (totalCampaignPoints <= 499) {
        gamesPoints = 4;
      } else {
        gamesPoints = 5;
      }

      const isEligibleChampion = totalBaskets >= 60 || totalCampaignPoints >= 700;
      if (isOverallEligibleWinner && isEligibleChampion) {
        gamesPoints = 7;
      }

      return {
        totalBaskets,
        foodPoints,
        rawClothingPoints,
        validClothingPoints,
        totalCampaignPoints,
        gamesPoints,
        isEligibleChampion,
      };
    }

    function parseCSVText(csvText) {
      const lines = csvText.split(/\r?\n/).filter((l) => l.trim().length > 0);
      if (lines.length < 2) return [];
      const splitLine = (line) => {
        const result = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') {
            inQuotes = !inQuotes;
          } else if (ch === ',' && !inQuotes) {
            result.push(current.trim());
            current = '';
          } else {
            current += ch;
          }
        }
        result.push(current.trim());
        return result;
      };
      const headers = splitLine(lines[0]);
      return lines.slice(1).map((line) => {
        const values = splitLine(line);
        const row = {};
        headers.forEach((h, idx) => {
          row[h] = values[idx] !== undefined ? values[idx] : '';
        });
        return row;
      });
    }

    // ============================================================================
    // UTILITÁRIOS DE TEMPO E ALGORITMO DE GERAÇÃO DE TABELA
    // ============================================================================
    function timeToMinutes(timeStr) {
      if (!timeStr || !timeStr.includes(':')) return 0;
      const [h, m] = timeStr.split(':').map(Number);
      return h * 60 + m;
    }

    function minutesToTime(mins) {
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    function generateTimeSlots(scheduleDays) {
      const slots = [];
      scheduleDays.forEach((day) => {
        day.shifts.forEach((shiftObj) => {
          let current = timeToMinutes(shiftObj.start);
          const end = timeToMinutes(shiftObj.end);
          const step = Math.max(5, Number(shiftObj.intervalMinutes) || 15);
          while (current <= end) {
            slots.push({
              slotId: `${day.id}-${shiftObj.name}-${minutesToTime(current)}`,
              dayId: day.id,
              dayDate: day.date,
              shift: shiftObj.name,
              time: minutesToTime(current),
              activeCourts: shiftObj.activeCourts || [],
              absOrder: slots.length,
            });
            current += step;
          }
        });
      });
      return slots;
    }

    function generateRoundRobinPairs(teamObjects) {
      const list = teamObjects.map((t) => (typeof t === 'string' ? t : t.name));
      if (list.length < 2) return [];
      if (list.length % 2 !== 0) list.push('BYE');
      const numRounds = list.length - 1;
      const half = list.length / 2;
      const pairs = [];

      for (let round = 0; round < numRounds; round++) {
        for (let i = 0; i < half; i++) {
          const t1 = list[i];
          const t2 = list[list.length - 1 - i];
          if (t1 !== 'BYE' && t2 !== 'BYE') {
            pairs.push({ teamA: t1, teamB: t2, round: round + 1 });
          }
        }
        const last = list.pop();
        list.splice(1, 0, last);
      }
      return pairs;
    }

    function buildFullSchedule(config) {
      const slots = generateTimeSlots(config.scheduleDays);
      const groupStageMatches = [];
      const playoffMatches = [];

      config.keys.forEach((keyObj) => {
        config.collectiveModalities
          .filter((m) => m.enabled && (!m.participatingKeys || m.participatingKeys.includes(keyObj.id)))
          .forEach((mod) => {
            mod.genders.forEach((gender) => {
              keyObj.groups.forEach((grp) => {
                const pairs = generateRoundRobinPairs(grp.teams);
                pairs.forEach((p, idx) => {
                  groupStageMatches.push({
                    tempId: `${keyObj.id}-${grp.id}-${mod.id}-${gender}-rr-${idx}`,
                    stage: 'Classificatória',
                    keyId: keyObj.id,
                    keyName: keyObj.name,
                    groupName: grp.name,
                    modality: mod.name,
                    gender,
                    teamA: p.teamA,
                    teamB: p.teamB,
                    round: p.round,
                    isPlayoff: false,
                  });
                });
              });

              if (keyObj.format === 'two_groups_cross_playoffs' && keyObj.groups.length >= 2) {
                const g1Name = keyObj.groups[0].name;
                const g2Name = keyObj.groups[1].name;
                const sf1TempId = `${keyObj.id}-${mod.id}-${gender}-sf1`;
                const sf2TempId = `${keyObj.id}-${mod.id}-${gender}-sf2`;

                playoffMatches.push({
                  tempId: sf1TempId,
                  stage: 'Semifinal 1',
                  keyId: keyObj.id,
                  keyName: keyObj.name,
                  groupName: 'Mata-Mata',
                  modality: mod.name,
                  gender,
                  teamA: `1º ${g1Name}`,
                  teamB: `2º ${g2Name}`,
                  round: 100,
                  isPlayoff: true,
                  playoffOrder: 1,
                });

                playoffMatches.push({
                  tempId: sf2TempId,
                  stage: 'Semifinal 2',
                  keyId: keyObj.id,
                  keyName: keyObj.name,
                  groupName: 'Mata-Mata',
                  modality: mod.name,
                  gender,
                  teamA: `2º ${g1Name}`,
                  teamB: `1º ${g2Name}`,
                  round: 100,
                  isPlayoff: true,
                  playoffOrder: 1,
                });

                playoffMatches.push({
                  tempId: `${keyObj.id}-${mod.id}-${gender}-3rd`,
                  stage: 'Disputa 3º Lugar',
                  keyId: keyObj.id,
                  keyName: keyObj.name,
                  groupName: 'Mata-Mata',
                  modality: mod.name,
                  gender,
                  teamA: 'Perdedor SF1',
                  teamB: 'Perdedor SF2',
                  dependsOn: [sf1TempId, sf2TempId],
                  dependencyType: 'loser',
                  round: 101,
                  isPlayoff: true,
                  playoffOrder: 2,
                });

                playoffMatches.push({
                  tempId: `${keyObj.id}-${mod.id}-${gender}-final`,
                  stage: 'Final (1º Lugar)',
                  keyId: keyObj.id,
                  keyName: keyObj.name,
                  groupName: 'Mata-Mata',
                  modality: mod.name,
                  gender,
                  teamA: 'Vencedor SF1',
                  teamB: 'Vencedor SF2',
                  dependsOn: [sf1TempId, sf2TempId],
                  dependencyType: 'winner',
                  round: 102,
                  isPlayoff: true,
                  playoffOrder: 3,
                });
              }
            });
          });
      });

      groupStageMatches.sort((a, b) => a.round - b.round);

      const courtBusy = {};
      const teamBusy = {};
      const teamLastSlot = {};
      const scheduled = [];

      function findBestSlotAndCourt(match, minSlotIdx = 0, avoidBackToBack = true) {
        const validCourts = config.courts.filter((c) =>
          c.allowedModalities.includes(match.modality)
        );
        if (validCourts.length === 0) return null;

        for (let sIdx = minSlotIdx; sIdx < slots.length; sIdx++) {
          const slot = slots[sIdx];
          if (!match.isPlayoff) {
            if (teamBusy[sIdx]?.[match.teamA] || teamBusy[sIdx]?.[match.teamB]) {
              continue;
            }
            if (avoidBackToBack) {
              const lastA = teamLastSlot[match.teamA];
              const lastB = teamLastSlot[match.teamB];
              if ((lastA !== undefined && sIdx - lastA <= 1) || (lastB !== undefined && sIdx - lastB <= 1)) {
                continue;
              }
            }
          } else {
            const sameStageConflict = scheduled.some(
              (m) =>
                m.slotIdx === sIdx &&
                m.keyId === match.keyId &&
                m.modality === match.modality &&
                m.gender === match.gender
            );
            if (sameStageConflict) continue;
          }

          for (const court of validCourts) {
            if (slot.activeCourts && slot.activeCourts.length > 0 && !slot.activeCourts.includes(court.id)) {
              continue;
            }
            if (!courtBusy[sIdx]?.[court.id]) {
              return { sIdx, court };
            }
          }
        }
        return null;
      }

      groupStageMatches.forEach((match) => {
        let allocation = findBestSlotAndCourt(match, 0, true);
        if (!allocation) {
          allocation = findBestSlotAndCourt(match, 0, false);
        }

        if (allocation) {
          const { sIdx, court } = allocation;
          courtBusy[sIdx] = { ...(courtBusy[sIdx] || {}), [court.id]: true };
          teamBusy[sIdx] = {
            ...(teamBusy[sIdx] || {}),
            [match.teamA]: true,
            [match.teamB]: true,
          };
          teamLastSlot[match.teamA] = sIdx;
          teamLastSlot[match.teamB] = sIdx;

          scheduled.push({
            ...match,
            slotIdx: sIdx,
            dayId: slots[sIdx].dayId,
            dayDate: slots[sIdx].dayDate,
            shift: slots[sIdx].shift,
            time: slots[sIdx].time,
            courtId: court.id,
            courtName: court.name,
            unscheduled: false,
            result: {
              status: 'pending',
              scoreA: '',
              scoreB: '',
              yellowA: 0,
              redA: 0,
              yellowB: 0,
              redB: 0,
              referee: '',
              observations: '',
            },
          });
        } else {
          scheduled.push({
            ...match,
            slotIdx: 99999,
            dayId: 'unscheduled',
            dayDate: 'Sem Horário Disponível',
            shift: '-',
            time: '--:--',
            courtId: '',
            courtName: 'Quadra Indisponível',
            unscheduled: true,
            result: {
              status: 'pending',
              scoreA: '',
              scoreB: '',
              yellowA: 0,
              redA: 0,
              yellowB: 0,
              redB: 0,
              referee: '',
              observations: '',
            },
          });
        }
      });

      const assignedMap = {};
      const orderedPlayoffs = [...playoffMatches].sort((a, b) => a.playoffOrder - b.playoffOrder);

      orderedPlayoffs.forEach((match) => {
        const relatedGroupSlots = scheduled
          .filter(
            (m) =>
              !m.isPlayoff &&
              !m.unscheduled &&
              m.keyId === match.keyId &&
              m.modality === match.modality &&
              m.gender === match.gender
          )
          .map((m) => m.slotIdx);

        let minSlot = relatedGroupSlots.length > 0 ? Math.max(...relatedGroupSlots) + 2 : 0;

        if (match.dependsOn) {
          const depSlots = match.dependsOn
            .map((id) => assignedMap[id]?.slotIdx)
            .filter((v) => v !== undefined && v < 99999);
          if (depSlots.length > 0) {
            minSlot = Math.max(minSlot, Math.max(...depSlots) + 2);
          }
        }

        let allocation = findBestSlotAndCourt(match, minSlot, false);
        if (!allocation && minSlot > 0) {
          allocation = findBestSlotAndCourt(match, Math.max(0, minSlot - 1), false);
        }

        if (allocation) {
          const { sIdx, court } = allocation;
          courtBusy[sIdx] = { ...(courtBusy[sIdx] || {}), [court.id]: true };
          const record = {
            ...match,
            slotIdx: sIdx,
            dayId: slots[sIdx].dayId,
            dayDate: slots[sIdx].dayDate,
            shift: slots[sIdx].shift,
            time: slots[sIdx].time,
            courtId: court.id,
            courtName: court.name,
            unscheduled: false,
            result: {
              status: 'pending',
              scoreA: '',
              scoreB: '',
              yellowA: 0,
              redA: 0,
              yellowB: 0,
              redB: 0,
              referee: '',
              observations: '',
            },
          };
          assignedMap[match.tempId] = record;
          scheduled.push(record);
        } else {
          const record = {
            ...match,
            slotIdx: 99999,
            dayId: 'unscheduled',
            dayDate: 'Sem Horário Disponível',
            shift: '-',
            time: '--:--',
            courtId: '',
            courtName: 'Quadra Indisponível',
            unscheduled: true,
            result: {
              status: 'pending',
              scoreA: '',
              scoreB: '',
              yellowA: 0,
              redA: 0,
              yellowB: 0,
              redB: 0,
              referee: '',
              observations: '',
            },
          };
          assignedMap[match.tempId] = record;
          scheduled.push(record);
        }
      });

      scheduled.sort((a, b) => {
        if (a.slotIdx !== b.slotIdx) return a.slotIdx - b.slotIdx;
        return a.courtName.localeCompare(b.courtName);
      });

      const numberByTempId = {};
      scheduled.forEach((m, idx) => {
        const gameNum = String(idx + 1).padStart(3, '0');
        m.gameNumber = gameNum;
        numberByTempId[m.tempId] = gameNum;
      });

      scheduled.forEach((m) => {
        if (m.dependsOn && m.dependsOn.length === 2) {
          const n1 = numberByTempId[m.dependsOn[0]] || '???';
          const n2 = numberByTempId[m.dependsOn[1]] || '???';
          if (m.dependencyType === 'loser') {
            m.teamA = `Perdedor Jogo nº ${n1}`;
            m.teamB = `Perdedor Jogo nº ${n2}`;
          } else {
            m.teamA = `Vencedor Jogo nº ${n1}`;
            m.teamB = `Vencedor Jogo nº ${n2}`;
          }
        }
      });

      return scheduled;
    }

          const promptText = `Você é um especialista em organização esportiva da Rede SAFA. Analise o regulamento anexado e extraia todas as informações estruturadas para configurar o torneio no sistema SAFA Sports.
Regras:
1. Extraia o nome do evento, ano/edição, local sede, unidades participantes e data de abertura (se houver).

4. Extraia todas as modalidades coletivas que geram jogos em tabela, indicando os gêneros ('Masculino', 'Feminino', 'Misto'), duração da partida e resumo da regra específica.
5. Extraia modalidades individuais, culturais ou complementares.
6. Extraia as chaves e grupos com suas respectivas equipes/turmas.`;

          const parts = [{ text: promptText }];

          const payload = {
            contents: [{ role: 'user', parts }],
            generationConfig: {
              responseMimeType: 'application/json',
              responseSchema: {
                type: 'OBJECT',
                properties: {
                  eventName: { type: 'STRING' },
                  year: { type: 'STRING' },

                      collectiveFourth: { type: 'NUMBER' },

                      type: 'OBJECT',
                      properties: {
                        name: { type: 'STRING' },
                        format: { type: 'STRING', enum: ['single_round_robin', 'two_groups_cross_playoffs'] },
                        groups: {
                          type: 'ARRAY',
                          items: {
                            type: 'OBJECT',
                            properties: {

                  collectiveModalities: {

                    items: {

                        genders: { type: 'ARRAY', items: { type: 'STRING' } },
                        minAthletes: { type: 'STRING' },
                        durationRule: { type: 'STRING' },
                        specificRule: { type: 'STRING' },

                        name: { type: 'STRING' },
                        type: { type: 'STRING' },

                        details: { type: 'STRING' },

          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },

          const allKeyIds = parsedKeys.map((k) => k.id);

          const parsedCollective =

      const handleSyncDonationsFromSheets = async () => {
        const urls = [
          { url: csvUrlAsaNorte, unitTag: 'BSB' },
          { url: csvUrlSobradinho, unitTag: 'SOB' },
        ].filter((u) => u.url && u.url.trim().startsWith('http'));

        if (urls.length === 0) {
          showToast('Informe ao menos um link CSV válido do Google Sheets.');
          return;
        }

        setIsSyncingDonations(true);
        try {
          const aggregated = {};
          const registeredTeams = [];
          config.keys.forEach((k) => {
            k.groups.forEach((g) => {
              g.teams.forEach((tObj) => {
                registeredTeams.push(typeof tObj === 'string' ? tObj : tObj.name);
              });
            });
          });

          const normalizeStr = (s) =>
            String(s || '')
              .toLowerCase()
              .normalize('NFD')
              .replace(/[\u0300-\u036f]/g, '')
              .replace(/[^a-z0-9]/g, '');

          for (const source of urls) {
            const resp = await fetch(source.url.trim());
            const text = await resp.text();
            const rows = parseCSVText(text);

            rows.forEach((row) => {
              const rawTurma = String(row['Turma'] || row['turma'] || '').trim();
              const rawUnidade = String(row['Unidade'] || row['unidade'] || source.unitTag).trim();
              if (!rawTurma) return;

              const unitSuffix = normalizeStr(rawUnidade).includes('sobradinho') ? 'SOB' : 'BSB';
              const normTurma = normalizeStr(rawTurma);

              let matchedTeam = registeredTeams.find((rt) => {
                const normRt = normalizeStr(rt);
                return normRt.includes(normTurma) && normRt.includes(normalizeStr(unitSuffix));
              });
              if (!matchedTeam) {
                matchedTeam = registeredTeams.find((rt) => normalizeStr(rt).includes(normTurma));
              }
              const targetName = matchedTeam || `${rawTurma} (${unitSuffix})`;

              if (!aggregated[targetName]) {
                aggregated[targetName] = {
                  cestaBasica: 0,
                  cestaIntermediaria: 0,
                  cestaCompleta: 0,
                  cobertor: 0,
                  moletom: 0,
                  mangaLonga: 0,
                  mangaCurta: 0,
                  calcados: 0,
                };
              }

              Object.entries(row).forEach(([colName, val]) => {
                const cLower = colName.toLowerCase();
                const num = parseFloat(String(val).replace(',', '.')) || 0;
                if (num <= 0) return;

                if (cLower.includes('cesta básica') || cLower.includes('cesta basica')) {
                  aggregated[targetName].cestaBasica += num;
                } else if (cLower.includes('cesta intermediária') || cLower.includes('cesta intermediaria')) {
                  aggregated[targetName].cestaIntermediaria += num;
                } else if (cLower.includes('cesta completa')) {
                  aggregated[targetName].cestaCompleta += num;
                } else if (cLower.includes('coberta') || cLower.includes('cobertor')) {
                  aggregated[targetName].cobertor += num;
                } else if (cLower.includes('moletom') || cLower.includes('casaco')) {
                  aggregated[targetName].moletom += num;
                } else if (cLower.includes('manga longa')) {
                  aggregated[targetName].mangaLonga += num;
                } else if (cLower.includes('manga curta') || cLower.includes('bermuda')) {
                  aggregated[targetName].mangaCurta += num;
                } else if (cLower.includes('calçado') || cLower.includes('calcado')) {
                  aggregated[targetName].calcados += num;
                }
              });
            });
          }

          setDonationsByTeam((prev) => ({ ...prev, ...aggregated }));
          showToast(`Dados de arrecadação sincronizados para ${Object.keys(aggregated).length} turma(s)!`);
        } catch (err) {

        const issues = [];
        let expectedTotal = 0;

        config.keys.forEach((keyObj) => {
          config.collectiveModalities

            .forEach((mod) => {
              mod.genders.forEach((gender) => {
                let expectedGroupGames = 0;
                keyObj.groups.forEach((grp) => {
                  const n = grp.teams.length;
                  if (n >= 2) expectedGroupGames += (n * (n - 1)) / 2;
                });
                const expectedPlayoffs =
                  keyObj.format === 'two_groups_cross_playoffs' && keyObj.groups.length >= 2 ? 4 : 0;
                const totalExpected = expectedGroupGames + expectedPlayoffs;
                expectedTotal += totalExpected;

                const actualMatches = matches.filter(
                  (m) => m.keyId === keyObj.id && m.modality === mod.name && m.gender === gender
                );

                if (actualMatches.length !== totalExpected) {
                  issues.push({
                    type: 'error',
                    title: `Contagem divergente em ${mod.name} (${gender}) - ${keyObj.name}`,
                    detail: `Esperado pelo regulamento: ${totalExpected} jogos. Encontrado na tabela: ${actualMatches.length} jogos.`,
                  });
                }
              });
            });
        });

        const unscheduled = matches.filter((m) => m.unscheduled);
        if (unscheduled.length > 0) {
          issues.push({
            type: 'error',
            title: `${unscheduled.length} jogo(s) sem horário ou quadra disponível`,
            detail: 'Aumente a janela de horários nos dias de competição ou habilite mais quadras.',
          });
        }

        const slotCourtSeen = {};
        const slotTeamSeen = {};
        matches
          .filter((m) => !m.unscheduled)
          .forEach((m) => {
            const scKey = `${m.dayDate}|${m.shift}|${m.time}|${m.courtName}`;
            if (slotCourtSeen[scKey]) {
              issues.push({
                type: 'error',
                title: `Conflito de Quadra no Jogo nº ${m.gameNumber}`,
                detail: `${m.courtName} ocupada simultaneamente às ${m.time} (${m.dayDate}).`,
              });
            }
            slotCourtSeen[scKey] = true;

            if (!m.isPlayoff) {
              [m.teamA, m.teamB].forEach((team) => {
                const stKey = `${m.dayDate}|${m.shift}|${m.time}|${team}`;
                if (slotTeamSeen[stKey]) {
                  issues.push({
                    type: 'error',
                    title: `Conflito de Equipe no Jogo nº ${m.gameNumber}`,
                    detail: `A turma ${team} está escalada em dois jogos simultâneos às ${m.time} (${m.dayDate}).`,
                  });
                }
                slotTeamSeen[stKey] = true;
              });
            }
          });

        const pairSeen = {};
        matches
          .filter((m) => !m.isPlayoff)
          .forEach((m) => {
            const sortedTeams = [m.teamA, m.teamB].sort().join(' vs ');
            const pKey = `${m.keyId}|${m.groupName}|${m.modality}|${m.gender}|${sortedTeams}`;
            if (pairSeen[pKey]) {
              issues.push({
                type: 'warning',
                title: `Confronto Repetido: ${sortedTeams}`,
                detail: `${m.modality} (${m.gender}) no ${m.groupName} aparece duplicado.`,
              });
            }
            pairSeen[pKey] = true;
          });

        return {
          expectedTotal,
          actualTotal: matches.length,
          issues,
          isHealthy: issues.length === 0,
        };
      }, [config, matches]);

      const filteredMatches = useMemo(() => {
        return matches.filter((m) => {
          if (filterDay !== 'ALL' && m.dayDate !== filterDay) return false;
          if (filterModality !== 'ALL' && m.modality !== filterModality) return false;
          if (filterKey !== 'ALL' && m.keyId !== filterKey) return false;
          if (searchTeam.trim()) {
            const q = searchTeam.toLowerCase();
            const hay = `${m.teamA} ${m.teamB} ${m.gameNumber} ${m.courtName}`.toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });
      }, [matches, filterDay, filterModality, filterKey, searchTeam]);

      const groupedTables = useMemo(() => {
        const groups = {};
        (config.specialEvents || []).forEach((ev) => {
          const label = `${ev.dayDate} – Turno ${ev.shift}`;
          if (!groups[label]) groups[label] = [];
          groups[label].push({
            isSpecial: true,
            gameNumber: '-',
            time: ev.time,
            courtName: ev.courtName,
            modality: ev.modality,
            gender: ev.gender,
            displayMatch: ev.description,
          });
        });

        matches.forEach((m) => {
          const label = m.unscheduled ? 'Jogos Pendentes de Alocação' : `${m.dayDate} – Turno ${m.shift}`;
          if (!groups[label]) groups[label] = [];
          groups[label].push({
            ...m,
            isSpecial: false,
            displayMatch: `${m.teamA} X ${m.teamB}`,
          });
        });
        return groups;
      }, [matches, config.specialEvents]);

      const startEditingRow = (m) => {
        setEditingGameNum(m.gameNumber);
        setEditForm({
          dayDate: m.dayDate,
          shift: m.shift,
          time: m.time,
          courtName: m.courtName,
        });
      };

      const saveEditingRow = (gameNumber) => {
        setMatches((prev) =>
          prev.map((m) =>
            m.gameNumber === gameNumber
              ? {
                  ...m,
                  dayDate: editForm.dayDate,
                  shift: editForm.shift,
                  time: editForm.time,
                  courtName: editForm.courtName,
                  unscheduled: false,
                }
              : m
          )
        );
        setEditingGameNum(null);
        showToast(`Jogo nº ${gameNumber} atualizado manualmente!`);
      };

      const openMatchSheet = (match) => {
        const res = match.result || {
          status: 'pending',
          scoreA: '',
          scoreB: '',
          yellowA: 0,
          redA: 0,
          yellowB: 0,
          redB: 0,
          referee: '',
          observations: '',
        };
        setSelectedMatchForSheet(match);
        setSheetForm({
          status: res.status === 'pending' ? 'finished' : res.status,
          scoreA: res.scoreA === '' ? 0 : Number(res.scoreA),
          scoreB: res.scoreB === '' ? 0 : Number(res.scoreB),
          yellowA: Number(res.yellowA) || 0,
          redA: Number(res.redA) || 0,
          yellowB: Number(res.yellowB) || 0,
          redB: Number(res.redB) || 0,
          referee: res.referee || '',
          observations: res.observations || '',
        });
      };

      const saveMatchSheet = (e) => {
        e.preventDefault();
        if (!selectedMatchForSheet) return;

        const finalScoreA =
          sheetForm.status === 'wo_a' ? 0 : sheetForm.status === 'wo_b' ? 1 : Number(sheetForm.scoreA);
        const finalScoreB =
          sheetForm.status === 'wo_b' ? 0 : sheetForm.status === 'wo_a' ? 1 : Number(sheetForm.scoreB);

        setMatches((prev) =>
          prev.map((m) =>
            m.gameNumber === selectedMatchForSheet.gameNumber
              ? {
                  ...m,
                  result: {
                    ...sheetForm,
                    scoreA: finalScoreA,
                    scoreB: finalScoreB,
                  },
                }
              : m
          )
        );
        showToast(`Súmula do Jogo nº ${selectedMatchForSheet.gameNumber} salva com sucesso!`);
        setSelectedMatchForSheet(null);
      };

      const clearMatchSheet = (gameNumber) => {
        setMatches((prev) =>
          prev.map((m) =>
            m.gameNumber === gameNumber
              ? {
                  ...m,
                  result: {
                    status: 'pending',
                    scoreA: '',
                    scoreB: '',
                    yellowA: 0,
                    redA: 0,
                    yellowB: 0,
                    redB: 0,
                    referee: '',
                    observations: '',
                  },
                }
              : m
          )
        );
        showToast(`Resultado do Jogo nº ${gameNumber} limpo.`);
        setSelectedMatchForSheet(null);
      };

      const standingsAndCards = useMemo(() => {
        const teamStats = {};
        const cardSummary = {};
        const overallRanking = {};

        const allRegisteredTeams = [];
        config.keys.forEach((k) => {
          k.groups.forEach((g) => {
            g.teams.forEach((tObj) => {
              const teamName = typeof tObj === 'string' ? tObj : tObj.name;
              allRegisteredTeams.push({ teamName, keyId: k.id, keyName: k.name });
            });
          });
        });

        const preliminaryDonations = allRegisteredTeams.map((t) => ({
          ...t,
          raw: donationsByTeam[t.teamName] || {},
          metrics: calculateDonationMetrics(donationsByTeam[t.teamName], false),
        }));

        preliminaryDonations.sort(
          (a, b) =>
            b.metrics.totalCampaignPoints - a.metrics.totalCampaignPoints ||
            b.metrics.totalBaskets - a.metrics.totalBaskets
        );

        const overallDonationWinner =
          preliminaryDonations.length > 0 && preliminaryDonations[0].metrics.isEligibleChampion
            ? preliminaryDonations[0].teamName
            : null;

        const donationSummaryByTeam = {};
        preliminaryDonations.forEach((item, idx) => {
          const isWinner = item.teamName === overallDonationWinner;
          donationSummaryByTeam[item.teamName] = {
            rank: idx + 1,
            team: item.teamName,
            keyId: item.keyId,
            keyName: item.keyName,
            raw: item.raw,
            ...calculateDonationMetrics(item.raw, isWinner),
            isOverallWinner: isWinner,
          };
        });

        config.keys.forEach((k) => {
          k.groups.forEach((g) => {
            g.teams.forEach((tObj) => {
              const teamName = typeof tObj === 'string' ? tObj : tObj.name;
              const donPts = donationSummaryByTeam[teamName]?.gamesPoints || 0;
              const donTotalCampaign = donationSummaryByTeam[teamName]?.totalCampaignPoints || 0;
              const donBaskets = donationSummaryByTeam[teamName]?.totalBaskets || 0;

              cardSummary[teamName] = {
                team: teamName,
                keyId: k.id,
                keyName: k.name,
                yellow: 0,
                red: 0,
                penaltyPoints: 0,
              };
              overallRanking[teamName] = {
                team: teamName,
                keyId: k.id,
                keyName: k.name,
                modalityPoints: 0,
                donationPoints: donPts,
                donationCampaignScore: donTotalCampaign,
                donationBaskets: donBaskets,
                cardPenalty: 0,
                totalPoints: 0,
                goldMedals: 0,
                silverMedals: 0,
                bronzeMedals: 0,
              };
            });
          });
        });

        matches.forEach((m) => {
          const res = m.result;
          if (!res || res.status === 'pending') return;

          if (!m.isPlayoff) {
            if (cardSummary[m.teamA]) {
              cardSummary[m.teamA].yellow += Number(res.yellowA) || 0;
              cardSummary[m.teamA].red += Number(res.redA) || 0;
            }
            if (cardSummary[m.teamB]) {
              cardSummary[m.teamB].yellow += Number(res.yellowB) || 0;
              cardSummary[m.teamB].red += Number(res.redB) || 0;
            }
          }

          if (m.isPlayoff) return;

          const bucketKey = `${m.keyId}|${m.groupName}|${m.modality}|${m.gender}`;
          if (!teamStats[bucketKey]) {
            teamStats[bucketKey] = {
              keyId: m.keyId,
              keyName: m.keyName,
              groupName: m.groupName,
              modality: m.modality,
              gender: m.gender,
              teams: {},
            };
          }

          [m.teamA, m.teamB].forEach((t) => {
            if (!teamStats[bucketKey].teams[t]) {
              teamStats[bucketKey].teams[t] = {
                team: t,
                pts: 0,
                played: 0,
                wins: 0,
                draws: 0,
                losses: 0,
                wo: 0,
                goalsFor: 0,
                goalsAgainst: 0,
                yellow: 0,
                red: 0,
              };
            }
          });

          const sA = Number(res.scoreA) || 0;
          const sB = Number(res.scoreB) || 0;
          const stA = teamStats[bucketKey].teams[m.teamA];
          const stB = teamStats[bucketKey].teams[m.teamB];

          stA.played += 1;
          stB.played += 1;
          stA.goalsFor += sA;
          stA.goalsAgainst += sB;
          stB.goalsFor += sB;
          stB.goalsAgainst += sA;
          stA.yellow += Number(res.yellowA) || 0;
          stA.red += Number(res.redA) || 0;
          stB.yellow += Number(res.yellowB) || 0;
          stB.red += Number(res.redB) || 0;

          if (res.status === 'wo_a') {
            stA.wo += 1;
            stA.pts += config.scoring.matchWO;
            stB.wins += 1;
            stB.pts += config.scoring.matchWin;
          } else if (res.status === 'wo_b') {
            stB.wo += 1;
            stB.pts += config.scoring.matchWO;
            stA.wins += 1;
            stA.pts += config.scoring.matchWin;
          } else if (sA > sB) {
            stA.wins += 1;
            stA.pts += config.scoring.matchWin;
            stB.losses += 1;
            stB.pts += config.scoring.matchLoss;
          } else if (sB > sA) {
            stB.wins += 1;
            stB.pts += config.scoring.matchWin;
            stA.losses += 1;
            stA.pts += config.scoring.matchLoss;
          } else {
            stA.draws += 1;
            stA.pts += config.scoring.matchDraw;
            stB.draws += 1;
            stB.pts += config.scoring.matchDraw;
          }
        });

        const yLimit = Math.max(1, Number(config.eventInfo.yellowCardPenaltyCount) || 3);
        const rLimit = Math.max(1, Number(config.eventInfo.redCardPenaltyCount) || 1);
        const penStep = Number(config.eventInfo.cardPenaltyPoints) || 0.5;

        Object.values(cardSummary).forEach((c) => {
          const blocksFromYellow = Math.floor(c.yellow / yLimit);
          const blocksFromRed = Math.floor(c.red / rLimit);
          c.penaltyPoints = Number(((blocksFromYellow + blocksFromRed) * penStep).toFixed(2));
          if (overallRanking[c.team]) {
            overallRanking[c.team].cardPenalty = c.penaltyPoints;
          }
        });

        const tables = Object.values(teamStats).map((bucket) => {
          const rows = Object.values(bucket.teams).sort((a, b) => {
            if (b.pts !== a.pts) return b.pts - a.pts;
            const discA = a.red * 3 + a.yellow;
            const discB = b.red * 3 + b.yellow;
            if (discA !== discB) return discA - discB;
            const gdA = a.goalsFor - a.goalsAgainst;
            const gdB = b.goalsFor - b.goalsAgainst;
            if (gdB !== gdA) return gdB - gdA;
            return b.goalsFor - a.goalsFor;
          });
          return { ...bucket, rows };
        });

        const rankPts = [
          config.scoring.collectiveRank.first,
          config.scoring.collectiveRank.second,
          config.scoring.collectiveRank.third,
          config.scoring.collectiveRank.fourth,
        ];

        tables.forEach((tbl) => {
          tbl.rows.forEach((row, idx) => {
            if (idx < 4 && overallRanking[row.team] && row.played > 0) {
              overallRanking[row.team].modalityPoints += Number(rankPts[idx]) || 0;
              if (idx === 0) overallRanking[row.team].goldMedals += 1;
              if (idx === 1) overallRanking[row.team].silverMedals += 1;
              if (idx === 2) overallRanking[row.team].bronzeMedals += 1;
            }
          });
        });

        const overallByKey = config.keys.map((k) => {
          const list = Object.values(overallRanking)
            .filter((item) => item.keyId === k.id)
            .map((item) => ({
              ...item,
              totalPoints: Number(
                (item.modalityPoints + item.donationPoints - item.cardPenalty).toFixed(2)
              ),
            }))
            .sort(
              (a, b) =>
                b.totalPoints - a.totalPoints ||
                b.donationCampaignScore - a.donationCampaignScore ||
                b.donationBaskets - a.donationBaskets ||
                b.goldMedals - a.goldMedals ||
                b.silverMedals - a.silverMedals ||
                a.cardPenalty - b.cardPenalty
            );
          return {
            keyId: k.id,
            keyName: k.name,
            teams: list,
          };
        });

        const completedCount = matches.filter((m) => m.result && m.result.status !== 'pending').length;

        return {
          tables,
          overallByKey,
          donationList: Object.values(donationSummaryByTeam).sort(
            (a, b) =>
              b.totalCampaignPoints - a.totalCampaignPoints || b.totalBaskets - a.totalBaskets
          ),
          donationSummaryByTeam,
          overallDonationWinner,
          cards: Object.values(cardSummary).sort((a, b) => b.penaltyPoints - a.penaltyPoints || b.red - a.red || b.yellow - a.yellow),
          completedCount,
        };
      }, [matches, config, donationsByTeam]);

      const navItems = [
        { id: 'config', label: '1. Regras & Estrutura', icon: Settings },
        { id: 'schedule', label: '2. Tabela de Jogos', icon: Calendar, badge: matches.length },
        {
          id: 'sheets',
          label: '3. Súmulas dos Jogos',
          icon: ClipboardList,
          badge: `${standingsAndCards.completedCount}/${matches.length}`,
        },
        { id: 'donations', label: '4. Arrecadação', icon: HeartHandshake },
        {
          id: 'results',
          label: isCompetitionClosed ? '5. Resultado Oficial' : '5. Resultados & Ranking',
          icon: Medal,
        },
        {
          id: 'audit',
          label: '6. Auditoria',
          icon: ShieldCheck,
          badge: auditReport.issues.length,
          alert: auditReport.issues.length > 0,
        },
        { id: 'regulation', label: '7. Regulamento Oficial', icon: FileText },
        { id: 'booklet', label: '8. Caderno de Tabelas', icon: TableIcon },
      ];

      // ======================================================================
      // TELA INICIAL DE CADASTRO DE EVENTO (PORTAL SAFA SPORTS)
      // ======================================================================
      if (!hasActiveEvent) {
        return (
          <div className="min-h-screen bg-slate-100 text-slate-900 font-sans flex flex-col">
            {toastMessage && (
              <div className="fixed bottom-5 right-5 z-50 flex items-center gap-2.5 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl border border-slate-700 text-sm">
                <CheckCircle2 className="w-4 h-4 text-emerald-400 shrink-0" />
                <span>{toastMessage}</span>
              </div>
            )}

            <header className="bg-gradient-to-r from-blue-950 via-blue-900 to-indigo-950 text-white border-b border-blue-800 shadow-md">
              <div className="max-w-5xl mx-auto px-4 sm:px-6 py-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div className="flex items-center gap-3.5">
                  <div className="w-12 h-12 rounded-2xl bg-amber-400/15 border border-amber-300/30 flex items-center justify-center shrink-0">
                    <Trophy className="w-7 h-7 text-amber-300" />
                  </div>
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="text-[11px] font-bold uppercase tracking-widest px-2 py-0.5 rounded bg-amber-400 text-blue-950">
                        Rede SAFA
                      </span>
                      <span className="text-xs text-blue-200">Controlador Oficial de Competições</span>
                    </div>
                    <h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight mt-0.5">
                      SAFA Sports
                    </h1>
                  </div>
                </div>

                <label className="flex items-center gap-2 bg-blue-800/80 hover:bg-blue-700 text-white text-xs sm:text-sm font-semibold px-4 py-2.5 rounded-xl border border-blue-700 transition cursor-pointer self-start sm:self-auto">
                  <Upload className="w-4 h-4 text-amber-300" />
                  Abrir Evento Salvo (.JSON)
                  <input type="file" accept=".json" onChange={handleImportJSON} className="hidden" />
                </label>
              </div>
            </header>

            <main className="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 py-8">
              <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                <div className="bg-slate-50 border-b border-slate-200 px-6 sm:px-8 py-5">
                  <div className="flex items-center gap-2 text-blue-800 text-xs font-bold uppercase tracking-wider mb-1">
                    <FilePlus2 className="w-4 h-4" /> Novo Controlador de Competição
                  </div>
                  <h2 className="text-xl font-extrabold text-slate-900">
                    Cadastrar Dados Iniciais do Evento
                  </h2>
                  <p className="text-xs sm:text-sm text-slate-600 mt-1">
                    Informe as prévias da competição abaixo. À medida que você adicionar equipes, datas, modalidades e regras nas próximas etapas, o <strong>Regulamento Oficial</strong> e a <strong>Tabela de Jogos</strong> serão atualizados automaticamente.
                  </p>
                </div>

                <form onSubmit={handleCreateNewEvent} className="p-6 sm:p-8 space-y-6">
                  {/* Importação de Regulamento */}
                  <div className="p-4 sm:p-5 rounded-2xl bg-gradient-to-r from-indigo-50 to-blue-50 border border-blue-200 space-y-3">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                      <div>
                        <div className="flex items-center gap-1.5 text-xs font-extrabold uppercase text-blue-900">
                          <Sparkles className="w-4 h-4 text-amber-500" />
                          Importar Arquivo de Regulamento (Novo Evento)
                        </div>
                        <p className="text-xs text-slate-600 mt-1">
                          Anexe um regulamento em <strong>PDF ou TXT</strong> (ou cole o texto) para estruturar automaticamente modalidades, regras, chaves e pontuações.
                        </p>
                      </div>
                      <div className="flex flex-wrap items-center gap-2 shrink-0">
                        <label className="flex items-center gap-1.5 bg-blue-900 hover:bg-blue-800 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-sm transition cursor-pointer">
                          <Upload className="w-4 h-4 text-amber-300" />
                          {isParsingReg ? 'Processando...' : 'Anexar Regulamento'}
                          <input
                            type="file"
                            accept=".pdf,.txt,.md,application/pdf,text/plain"
                            disabled={isParsingReg}
                            onChange={(e) => handleRegulationFileUpload(e, false)}
                            className="hidden"
                          />
                        </label>
                        <button
                          type="button"
                          disabled={isParsingReg}
                          onClick={() => setRawRegTextModalOpen(true)}
                          className="text-xs font-bold bg-white hover:bg-slate-100 text-blue-900 border border-blue-300 px-3.5 py-2.5 rounded-xl transition cursor-pointer"
                        >
                          Colar Texto
                        </button>
                      </div>
                    </div>
                    <div className="pt-2 border-t border-blue-200/60 flex flex-col sm:flex-row sm:items-center gap-2">
                      <span className="text-[11px] font-semibold text-blue-900 shrink-0">
                        Chave API Gemini (opcional, apenas para leitura automática de PDF):
                      </span>
                      <input
                        type="password"
                        value={geminiApiKey}
                        onChange={(e) => setGeminiApiKey(e.target.value)}
                        placeholder="AIzaSy..."
                        className="flex-1 text-xs bg-white border border-blue-200 rounded-lg px-2.5 py-1 outline-none"
                      />
                    </div>
                    {isParsingReg && (
                      <p className="text-xs font-bold text-blue-800 animate-pulse">⏳ {regUploadStatus}</p>
                    )}
                  </div>

                  {/* Modelo Oficial de Regulamento */}
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2.5">
                      1. Modelo Oficial de Regulamento e Público da Competição
                    </label>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <button
                        type="button"
                        onClick={() =>
                          setSetupForm({
                            ...setupForm,
                            audienceType: 'students',
                            regulationTemplate: 'safao',
                            name: 'Jogos Internos SAFÃO',
                            includeOpeningCeremony: true,
                          })
                        }
                        className={`p-4 rounded-2xl border-2 text-left transition flex items-start gap-3 cursor-pointer ${
                          setupForm.regulationTemplate === 'safao'
                            ? 'border-blue-800 bg-blue-50/70'
                            : 'border-slate-200 hover:border-slate-300 bg-white'
                        }`}
                      >
                        <div
                          className={`p-2 rounded-xl shrink-0 ${
                            setupForm.regulationTemplate === 'safao'
                              ? 'bg-blue-800 text-white'
                              : 'bg-slate-100 text-slate-600'
                          }`}
                        >
                          <GraduationCap className="w-5 h-5" />
                        </div>
                        <div>

            {/* ABA 8: CADERNO DE TABELAS */}
            {activeTab === 'booklet' && (
              <div className="space-y-4">
                <div className="no-print bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-3">
                  <h2 className="text-sm font-bold text-slate-900">Caderno de Tabelas Diagramado – {fullEventTitle}</h2>
                  <div className="flex gap-2">
                    <button onClick={() => handleCopyHTML('booklet-doc', 'Tabelas de Jogos')} className="flex items-center gap-1.5 bg-slate-100 text-slate-800 text-xs font-bold px-3.5 py-2 rounded-xl cursor-pointer">
                      <Copy className="w-4 h-4" /> Copiar HTML
                    </button>
                    <button onClick={() => window.print()} className="flex items-center gap-1.5 bg-blue-900 text-white text-xs font-bold px-3.5 py-2 rounded-xl cursor-pointer">
                      <Printer className="w-4 h-4" /> Imprimir / PDF
                    </button>
                  </div>
                </div>

                <div id="booklet-doc" className="print-container bg-white p-8 rounded-2xl shadow-sm border border-slate-200 max-w-5xl mx-auto space-y-8">
                  <div className="text-center border-b-2 border-blue-950 pb-4">
                    {config.eventInfo.logoDataUrl && (
                      <img src={config.eventInfo.logoDataUrl} alt={`Logo ${fullEventTitle}`} className="h-20 max-w-[200px] object-contain mx-auto mb-3" />
                    )}
                    <p className="text-xs font-bold uppercase tracking-widest text-blue-800">SAFA SPORTS • {config.eventInfo.institution}</p>
                    <h1 className="text-2xl font-extrabold text-blue-950 mt-1">TABELA OFICIAL DE JOGOS — {fullEventTitle}</h1>
                  </div>

                  {Object.entries(groupedTables).map(([sectionTitle, sectionMatches]) => (
                    <div key={sectionTitle} className="break-inside-avoid">
                      <h2 className="text-sm font-extrabold uppercase bg-blue-900 text-white px-4 py-2 rounded-t-lg">{sectionTitle}</h2>
                      <table className="w-full border-collapse border border-slate-300 text-xs">
                        <thead>
                          <tr className="bg-slate-100 text-slate-800">
                            <th className="border border-slate-300 py-2 px-2 text-center w-20">Horário</th>
                            <th className="border border-slate-300 py-2 px-2 text-center w-20">Jogo Nº</th>
                            <th className="border border-slate-300 py-2 px-2 text-center">Local</th>
                            <th className="border border-slate-300 py-2 px-2 text-center">Modalidade</th>
                            <th className="border border-slate-300 py-2 px-2 text-center">Sexo</th>
                            <th className="border border-slate-300 py-2 px-2 text-center">Equipes / Confronto</th>
                          </tr>
                        </thead>
                        <tbody>
                          {sectionMatches.map((m, idx) => (
                            <tr key={`${sectionTitle}-${idx}`} className={idx % 2 === 1 ? 'bg-slate-50' : 'bg-white'}>
                              <td className="border border-slate-300 py-1.5 px-2 text-center font-mono font-semibold">{m.time}</td>
                              <td className="border border-slate-300 py-1.5 px-2 text-center font-bold text-blue-950">{m.gameNumber}</td>
                              <td className="border border-slate-300 py-1.5 px-2 text-center">{m.courtName}</td>
                              <td className="border border-slate-300 py-1.5 px-2 text-center font-semibold">{m.modality}</td>
                              <td className="border border-slate-300 py-1.5 px-2 text-center">{m.gender}</td>
                              <td className="border border-slate-300 py-1.5 px-2 text-center font-bold">{m.displayMatch}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* Modal de Súmula Oficial */}
          {selectedMatchForSheet && (
            <div className="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-2xl w-full overflow-hidden">
                <div className="bg-blue-950 text-white px-6 py-4 flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    {config.eventInfo.logoDataUrl && (
                      <img src={config.eventInfo.logoDataUrl} alt={`Logo ${fullEventTitle}`} className="w-11 h-11 rounded-lg bg-white object-contain p-1 shrink-0" />
                    )}
                    <div>
                      <span className="text-[11px] font-bold uppercase px-2 py-0.5 rounded bg-amber-400 text-blue-950">
                        Súmula Oficial • Jogo nº {selectedMatchForSheet.gameNumber}
                      </span>
                      <h3 className="text-base sm:text-lg font-extrabold mt-1">
                        {selectedMatchForSheet.modality} ({selectedMatchForSheet.gender}) — {selectedMatchForSheet.courtName}
                      </h3>
                    </div>
                  </div>
                  <button onClick={() => setSelectedMatchForSheet(null)} className="p-1.5 rounded-lg bg-blue-900 text-white cursor-pointer">
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={saveMatchSheet} className="p-6 space-y-5">
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                    {[
                      { id: 'finished', label: 'Jogo Realizado' },
                      { id: 'wo_a', label: `W.O. de ${selectedMatchForSheet.teamA}` },
                      { id: 'wo_b', label: `W.O. de ${selectedMatchForSheet.teamB}` },
                    ].map((opt) => (
                      <button
                        key={opt.id}
                        type="button"
                        onClick={() => setSheetForm({ ...sheetForm, status: opt.id })}
                        className={`px-3 py-2 rounded-xl text-xs font-bold border text-left cursor-pointer ${
                          sheetForm.status === opt.id ? 'bg-blue-900 text-white border-blue-900' : 'bg-slate-50 text-slate-700 border-slate-200'
                        }`}
                      >
                        {opt.label}
                      </button>
                    ))}
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-3">
                      <p className="font-extrabold text-sm text-slate-900">{selectedMatchForSheet.teamA}</p>
                      <input
                        type="number"
                        min="0"
                        disabled={sheetForm.status !== 'finished'}
                        value={sheetForm.status === 'wo_a' ? 0 : sheetForm.status === 'wo_b' ? 1 : sheetForm.scoreA}
                        onChange={(e) => setSheetForm({ ...sheetForm, scoreA: Number(e.target.value) })}
                        className="w-full text-center text-2xl font-extrabold text-blue-950 bg-white border border-slate-300 rounded-xl py-2"
                      />
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="block text-[11px] font-bold text-amber-700 mb-1">Amarelos</label>
                          <input type="number" min="0" value={sheetForm.yellowA} onChange={(e) => setSheetForm({ ...sheetForm, yellowA: Number(e.target.value) })} className="w-full text-center font-bold text-sm bg-amber-50 border border-amber-300 rounded-lg py-1.5" />
                        </div>
                        <div>
                          <label className="block text-[11px] font-bold text-red-700 mb-1">Vermelhos</label>
                          <input type="number" min="0" value={sheetForm.redA} onChange={(e) => setSheetForm({ ...sheetForm, redA: Number(e.target.value) })} className="w-full text-center font-bold text-sm bg-red-50 border border-red-300 rounded-lg py-1.5" />
                        </div>
                      </div>
                    </div>

                    <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-3">
                      <p className="font-extrabold text-sm text-slate-900">{selectedMatchForSheet.teamB}</p>
                      <input
                        type="number"
                        min="0"
                        disabled={sheetForm.status !== 'finished'}
                        value={sheetForm.status === 'wo_b' ? 0 : sheetForm.status === 'wo_a' ? 1 : sheetForm.scoreB}
                        onChange={(e) => setSheetForm({ ...sheetForm, scoreB: Number(e.target.value) })}
                        className="w-full text-center text-2xl font-extrabold text-blue-950 bg-white border border-slate-300 rounded-xl py-2"
                      />
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="block text-[11px] font-bold text-amber-700 mb-1">Amarelos</label>
                          <input type="number" min="0" value={sheetForm.yellowB} onChange={(e) => setSheetForm({ ...sheetForm, yellowB: Number(e.target.value) })} className="w-full text-center font-bold text-sm bg-amber-50 border border-amber-300 rounded-lg py-1.5" />
                        </div>
                        <div>
                          <label className="block text-[11px] font-bold text-red-700 mb-1">Vermelhos</label>
                          <input type="number" min="0" value={sheetForm.redB} onChange={(e) => setSheetForm({ ...sheetForm, redB: Number(e.target.value) })} className="w-full text-center font-bold text-sm bg-red-50 border border-red-300 rounded-lg py-1.5" />
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="pt-2 border-t border-slate-200 flex items-center justify-between gap-2">
                    <button type="button" onClick={() => window.print()} className="flex items-center gap-1.5 text-xs font-bold bg-slate-100 text-slate-800 px-3 py-2 rounded-xl cursor-pointer">
                      <Printer className="w-3.5 h-3.5" /> Imprimir Súmula
                    </button>
                    <div className="flex items-center gap-2">
                      <button type="button" onClick={() => setSelectedMatchForSheet(null)} className="text-xs font-semibold text-slate-600 px-4 py-2 rounded-xl cursor-pointer">
                        Cancelar
                      </button>
                      <button type="submit" className="flex items-center gap-1.5 bg-emerald-600 text-white text-xs font-bold px-5 py-2.5 rounded-xl cursor-pointer">
                        <CheckCircle2 className="w-4 h-4" /> Salvar Súmula
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
